services:
  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: discord-bot-dev
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - APP_ID=${APP_ID}
      - PUBLIC_KEY=${PUBLIC_KEY}
      - YTDLP_POT_PROVIDER_URL=http://bgutil-provider:4416
      - LOCAL_MP3_DIR=/app/mp3s
    volumes:
      - ./mp3s:/app/mp3s:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider-dev
    init: true
    restart: unless-stopped
    ports:
      - "4416:4416"

  filebrowser:
    image: gtstef/filebrowser:1.5.2-stable
    container_name: filebrowser-dev
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
    volumes:
      - ./mp3s:/srv
      - filebrowser_data:/home/filebrowser/data
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  filebrowser_data:
