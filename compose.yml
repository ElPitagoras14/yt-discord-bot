services:
  discord-bot:
    image: ghcr.io/elpitagoras14/yt-discord-bot:latest
    pull_policy: always
    container_name: discord-bot
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - APP_ID=${APP_ID}
      - PUBLIC_KEY=${PUBLIC_KEY}
      - YTDLP_POT_PROVIDER_URL=http://bgutil-provider:4416
      - LOCAL_MP3_DIR=/app/mp3s
    volumes:
      - mp3_storage:/app/mp3s:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    init: true
    restart: unless-stopped

  # Docker creates mp3_storage owned by root, but filebrowser runs as uid 1000
  # and would fail every upload with "permission denied". Fix the ownership
  # before it starts. Runs on every up and is a no-op once already correct.
  mp3-permissions:
    image: alpine:3
    command: sh -c "chown -R 1000:1000 /srv && chmod -R a+rX /srv"
    volumes:
      - mp3_storage:/srv
    restart: "no"

  filebrowser:
    image: gtstef/filebrowser:1.5.2-stable
    container_name: filebrowser
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
    volumes:
      - mp3_storage:/srv
      - filebrowser_data:/home/filebrowser/data
    ports:
      - "8080:80"
    restart: unless-stopped
    depends_on:
      mp3-permissions:
        condition: service_completed_successfully

volumes:
  mp3_storage:
  filebrowser_data:
