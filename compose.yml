services:
  discord-bot:
    image: ghcr.io/elpitagoras14/yt-discord-bot:latest
    pull_policy: always
    container_name: discord-bot
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - APP_ID=${APP_ID}
      - PUBLIC_KEY=${PUBLIC_KEY}
      - YTDLP_POT_PROVIDER_URL=http://bgutil-provider:4416
      - LOCAL_MP3_DIR=/app/mp3s
    volumes:
      - mp3_storage:/app/mp3s:ro
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped
    depends_on:
      - bgutil-provider

  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-provider
    init: true
    restart: unless-stopped

  filebrowser:
    image: gtstef/filebrowser:1.5.2-stable
    container_name: filebrowser
    environment:
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD}
    volumes:
      - mp3_storage:/srv
      - filebrowser_data:/home/filebrowser/data
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  mp3_storage:
  filebrowser_data:
